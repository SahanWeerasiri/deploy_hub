server {
    listen 80;
    server_name localhost;

    # Forest Portfolio
    location /portfolio/ {
        proxy_pass http://forest-portfolio:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/portfolio/(.*)$ /$1 break;
    }

    # Chat Client
    location /chat-client/ {
        proxy_pass http://chat-client:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/chat-client/(.*)$ /$1 break;
    }

    # Chat Server API
    location /api/ {
        proxy_pass http://chat-server:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
