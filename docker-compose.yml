version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # - chat-api
      # - chat-client
      - forest-portfolio
    networks:
      - app-network
  forest-portfolio:
    build: ./test_forest_portfolio_3js
    container_name: forest-portfolio
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
