services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - forest-portfolio
    networks:
      - app-network
  forest-portfolio:
    image: sahanlahiru/sahan:forest
    container_name: sahanlahiruforest
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
