version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chat-api
      - chat-client
      - forest-portfolio
    networks:
      - app-network

  chat-api:
    build: ./temporary-chatting/server
    container_name: chat-api
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./temporary-chatting/server/src/data:/app/temporary-chatting/server/src/data
    restart: unless-stopped
    networks:
      - app-network

  chat-client:
    build: ./temporary-chatting/client
    container_name: chat-client
    depends_on:
      - chat-api
    restart: unless-stopped
    networks:
      - app-network

  forest-portfolio:
    build: ./test_forest_portfolio_3js
    container_name: forest-portfolio
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
