services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - forest-portfolio
    networks:
      - app-network
  forest-portfolio:
    image: sahanlahiru/sahan:forest
    container_name: sahanlahiruforest
    restart: unless-stopped
    networks:
      - app-network

  chat-server:
    image: sahanlahiru/sahan:chat-server
    container_name: chat-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - app-network

  chat-client:
    image: sahanlahiru/sahan:chat-client
    container_name: chat-client
    restart: unless-stopped
    ports:
      - "5001:5001"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
