name: Deploy Workflow
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Pull Deploy Hub
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          cd /home/ubuntu/deploy_hub && git pull origin master --no-rebase

          echo "Pulled Deploy Hub repository."

          EOF

      - name: Pull Forest Portfolio
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          mkdir -p /home/ubuntu/test_forest_portfolio_3js

          cd /home/ubuntu/test_forest_portfolio_3js && git pull origin master --no-rebase

          echo "Pulled Forest Portfolio repository."

          cd /home/ubuntu/test_forest_portfolio_3js && cp /home/ubuntu/deploy_hub/Docker/ForestPortfolio.Dockerfile /home/ubuntu/test_forest_portfolio_3js/ForestPortfolio.Dockerfile

          echo "Copied ForestPortfolio.Dockerfile."

          EOF

      - name: Build Docker Images for Forest Portfolio
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          echo "Building Docker images for Forest Portfolio."

          cd /home/ubuntu/test_forest_portfolio_3js && docker build -f ForestPortfolio.Dockerfile -t forest-portfolio ../deploy_hub

          echo "Built Docker images for Forest Portfolio."

          EOF

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          cd /home/ubuntu/deploy_hub && docker-compose down

          cd /home/ubuntu/deploy_hub && docker-compose up -d --build

          echo "Deployed application with Docker Compose."

          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key
