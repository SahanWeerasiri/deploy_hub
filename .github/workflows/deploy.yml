      #       echo "Built Docker images for Temporary Chatting Server."

      #       EOF

      - name: Pull Forest Portfolio
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          cd /home/ubuntu/deploy_hub/test_forest_portfolio_3js && git pull origin master --no-rebase

          echo "Pulled Forest Portfolio repository."

          cd /home/ubuntu/deploy_hub/test_forest_portfolio_3js && cp /home/ubuntu/deploy_hub/Docker/ForestPortfolio.Dockerfile /home/ubuntu/deploy_hub/test_forest_portfolio_3js/ForestPortfolio.Dockerfile

          echo "Copied ForestPortfolio.Dockerfile."

          EOF

      - name: Build Docker Images for Forest Portfolio
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          echo "Building Docker images for Forest Portfolio."

          cd /home/ubuntu/deploy_hub/test_forest_portfolio_3js && docker build -f ForestPortfolio.Dockerfile -t forest-portfolio .

          echo "Built Docker images for Forest Portfolio."

          EOF

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          cd /home/ubuntu/deploy_hub && docker-compose down

          cd /home/ubuntu/deploy_hub && docker-compose up -d --build

          echo "Deployed application with Docker Compose."

          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key
