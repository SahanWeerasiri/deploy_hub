name: Deploy Workflow
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Pull and deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          cd /home/ubuntu/deploy_hub && git pull origin master --no-rebase

          cat > /home/ubuntu/deploy.sh << 'EOS'
          #!/bin/bash
          cd /home/ubuntu/deploy_hub
          docker login
          docker pull sahanlahiru/sahan:chat-client
          docker pull sahanlahiru/sahan:chat-server
          docker-compose down
          docker-compose up -d --build
          echo "Deployed application with Docker Compose."
          EOS
          chmod +x /home/ubuntu/deploy.sh
          nohup /home/ubuntu/deploy.sh > /home/ubuntu/deploy.log 2>&1 &
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key
