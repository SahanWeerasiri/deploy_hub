      #       echo "Copied TemporaryChattingServer.Dockerfile."

      #       EOF

      # - name: Build Docker Images for Temporary Chatting Client
      #   run: |
      #       ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
      #         ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

      #       echo "Building Docker images for Temporary Chatting Client."

      #       cd /home/ubuntu/deploy_hub/temporary-chatting/client && docker build -f TemporaryChattingClient.Dockerfile -t chat-client .

      #       echo "Built Docker images for Temporary Chatting Client."

      #       EOF

      # - name: Build Docker Images for Temporary Chatting Server
      #   run: |
      #       ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
      #         ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

